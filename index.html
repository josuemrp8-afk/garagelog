<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GarageLog">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg">
<title>GarageLog</title>
<style>
:root{--bg:#111827;--card:#1f2937;--line:#374151;--tx:#f3f4f6;--mu:#9ca3af;--ac:#f59e0b;--ok:#10b981;--warn:#f59e0b;--bad:#ef4444}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,sans-serif;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;z-index:5}
header select{flex:1}
main{padding:14px;max-width:700px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0b1220;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:10px 2px;font-size:12px;border-radius:0}
nav button.on{color:var(--ac)}
nav button b{display:block;font-size:20px}
.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
h2{margin:6px 0 10px;font-size:18px}h3{margin:0 0 4px;font-size:16px}
.mu{color:var(--mu);font-size:13px}
input,select,textarea,button{font:inherit;color:var(--tx);background:#0f172a;border:1px solid var(--line);border-radius:8px;padding:9px;width:100%;margin:3px 0}
button{width:auto;background:var(--ac);color:#111;border:0;font-weight:600;padding:9px 14px}
button.sec{background:#374151;color:var(--tx)}button.del{background:none;color:var(--bad);padding:4px 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;font-weight:700;color:#111;white-space:nowrap}
.ok{background:var(--ok)}.soon{background:var(--warn)}.over{background:var(--bad)}.none{background:var(--mu)}
.car{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 10px;font-size:14px}
.car span{color:var(--mu)}
</style>
</head>
<body>
<header><select id="veh"></select><button class="sec" id="addveh">+ Car</button></header>
<main id="main"></main>
<nav id="nav"></nav>
<script src="app.js"></script>
</body>
</html>
